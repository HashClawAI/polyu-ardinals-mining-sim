services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyu
      POSTGRES_PASSWORD: polyu_password
      POSTGRES_DB: polyu_af5644_sim
    ports:
      - "5432:5432"
    volumes:
      - polyu_af5644_sim_db:/var/lib/postgresql/data

volumes:
  polyu_af5644_sim_db:
